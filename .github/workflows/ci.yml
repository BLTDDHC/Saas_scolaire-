name: SaaS School CI

on:
  push:
    branches:
      - main
      - finalisation/**
      - ux-*
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: saas-school-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend + PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saas_scolaire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_scolaire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/saas_scolaire_test
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create isolated relational base schema
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import Base, engine; Base.metadata.create_all(engine)"

      - name: Align isolated schema with historical migration baseline
        run: |
          psql -h localhost -U postgres -d saas_scolaire_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_cycles_establishment_code
            ON school_cycles (establishment_id, code);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_levels_establishment_cycle_code
            ON school_levels (establishment_id, cycle_id, code);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_cycles_id_establishment
            ON school_cycles (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_levels_id_cycle_establishment
            ON school_levels (id, cycle_id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_academic_years_id_establishment
            ON academic_years (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_classes_id_establishment
            ON classes (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_students_id_establishment
            ON students (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_teachers_id_establishment
            ON teachers (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_subjects_id_establishment
            ON subjects (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_series_id_establishment
            ON school_series (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_directions_id_establishment
            ON school_directions (id, establishment_id);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_directions_establishment_code
            ON school_directions (establishment_id, code);
          CREATE UNIQUE INDEX IF NOT EXISTS ci_uq_school_direction_cycles_establishment_cycle
            ON school_direction_cycles (establishment_id, cycle_id);
          SQL

      - name: Apply migrations to isolated test database
        run: |
          for migration in backend/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d saas_scolaire_test -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test

      - name: Flutter Web photo regression test
        run: flutter test --platform chrome test/student_photo_picker_web_test.dart

      - name: Flutter Web analytics and results regression tests
        run: |
          flutter test --platform chrome test/statistics_analytics_dashboard_test.dart
          flutter test --platform chrome test/parent_results_separation_test.dart
          flutter test --platform chrome test/admin_school_core_finalization_test.dart --plain-name "un eleve consulte ses resultats sans ecran de saisie"

      - name: Build Web release
        run: flutter build web --release

      - name: Build Android APK release
        run: flutter build apk --release

      - name: Build Android App Bundle release
        run: flutter build appbundle --release
