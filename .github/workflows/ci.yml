name: SaaS School CI

on:
  push:
    branches:
      - main
      - finalisation/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend + PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saas_scolaire_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_scolaire_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/saas_scolaire_test
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Create isolated relational base schema
        env:
          PYTHONPATH: backend
        run: python -c "from app.main import Base, engine; Base.metadata.create_all(engine)"

      - name: Apply migrations to isolated test database
        run: |
          for migration in backend/migrations/*.sql; do
            echo "Applying ${migration}"
            psql -h localhost -U postgres -d saas_scolaire_test -v ON_ERROR_STOP=1 -f "${migration}"
          done

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter tests
        run: flutter test
