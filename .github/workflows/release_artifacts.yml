name: MAYELE Plus Release Artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayele-plus-release-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: https://saas-scolaire-staging-api.onrender.com

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MAYELE_plus_android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MAYELE-plus-Android-APK
          path: MAYELE_plus_android.apk
          if-no-files-found: error

  windows:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Build Windows release
        shell: pwsh
        run: flutter build windows --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Package Windows application
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "MAYELE_plus_windows_x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MAYELE-plus-Windows-x64
          path: MAYELE_plus_windows_x64.zip
          if-no-files-found: error

  ios:
    name: iOS unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Package unsigned IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qry MAYELE_plus_ios_unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MAYELE-plus-iOS-unsigned
          path: MAYELE_plus_ios_unsigned.ipa
          if-no-files-found: error

  macos:
    name: macOS Desktop
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Build macOS release
        run: flutter build macos --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - name: Package macOS application
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/MAYELE +.app" "MAYELE_plus_macos.zip" || ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/edupro_flutter_web.app" "MAYELE_plus_macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MAYELE-plus-macOS
          path: MAYELE_plus_macos.zip
          if-no-files-found: error
